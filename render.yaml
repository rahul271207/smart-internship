services:
  - type: web
    name: siae-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_MEMORY_DB
        value: false
      - key: SECRET_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: smart_internship
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_SEMANTIC_MATCHING
        value: false
